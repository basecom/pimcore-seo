# Studio API routes -> /pimcore-studio/api/seo/...
# The prefix has to stay in sync with SeoBundle\Studio\OpenApi\Config\Prefix::BUNDLE.
seo.studio_api:
    resource: '../../src/Controller/Studio/'
    type: attribute
    prefix: '%pimcore_studio_backend.url_prefix%/seo'
    options:
        expose: true
